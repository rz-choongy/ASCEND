body{margin:0;padding:28px;background:#E9EAEE;font-family:'Inter',sans-serif;color:#151515}
h1{font-size:22px;margin:0 0 4px} p.lead{margin:0 0 20px;color:#555;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(6,300px);gap:18px}
figure{margin:0} figcaption{display:flex;flex-direction:column;margin-bottom:8px} figcaption span{color:#666;font-size:13px}
.ph{background:#F1F2F6;border-radius:28px;padding:20px 14px;height:600px;font-size:14px}
.date{color:#666;font-size:13px} .t{font-size:30px;line-height:1.05;margin:2px 0 14px}
.seg{display:flex;background:#fff;border-radius:99px;padding:4px} .seg span{flex:1;text-align:center;padding:8px;border-radius:99px;color:#555} .seg .on{background:#151515;color:#fff}
.gym{display:flex;align-items:center;gap:8px;margin:14px 2px} .gym i{width:8px;height:8px;border-radius:4px;background:#1C9C8C} .gym u{margin-left:auto;color:#555;font-size:13px}
.btn{background:#2BB3A3;color:#06201C;text-align:center;padding:14px;border-radius:99px;font-weight:600;font-size:16px;margin-bottom:12px}
.card{background:#fff;border-radius:18px;padding:12px;margin-bottom:10px} .ch{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px} .ch span{font-weight:400;color:#666;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr)} .stats>div+div{border-left:1px solid #E7E8ED;padding-left:10px}
.stats small{display:block;color:#666;font-size:13px} .stats b{display:flex;align-items:center;gap:5px;font-size:26px;line-height:1.1} .stats em{font-style:normal;color:#666;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;background:#E0533F}
.wk{display:flex;justify-content:space-between} .wk p{margin:0;text-align:center} .wk small{display:block;color:#666;font-size:13px;margin-bottom:4px} .wk i{display:block;width:30px;height:30px;border-radius:15px;background:#ECEDF1} .wk i.f{background:#2BB3A3} .wk i.t{box-shadow:0 0 0 2px #151515 inset}
.row{display:flex;justify-content:space-between;align-items:center} .row em{display:block;font-style:normal;color:#666;font-size:13px} .rt{font-weight:600} .rr{display:flex;align-items:center;gap:6px} .rr b{font-size:20px}
</style>
